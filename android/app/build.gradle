plugins {
    id 'com.android.application'
}

android {
    namespace 'com.storyweave.studio'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.storyweave.studio'
        minSdk 24
        targetSdk 34
        versionCode 64
        versionName '1.9.19-native-review-fix'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
